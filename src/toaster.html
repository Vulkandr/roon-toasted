<!doctype html>
<!-- This Source Code Form is subject to the terms of the Mozilla Public
     License, v. 2.0. If a copy of the MPL was not distributed with this
     file, You can obtain one at https://mozilla.org/MPL/2.0/. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Toaster</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="toaster.css" />
    <script type="module" src="/toaster.js" defer></script>
  </head>

  <!-- Icons: Lucide (https://lucide.dev), ISC License, Copyright (c) Lucide Contributors -->

  <body>
    <!-- Window bar (the Windows title bar is turned off): drag it to move the
         window, double-click it to maximize -->
    <div class="titlebar" data-tauri-drag-region="deep">
      <span class="titlebar-logo"></span>
      <span class="titlebar-title">Roon: Toasted</span>
      <button id="win-maximize" class="win-btn" title="Maximize">
        <svg class="icon-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        <svg class="icon-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="8" width="11" height="11" rx="1"/><path d="M8 8V6a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-2"/></svg>
      </button>
      <button id="win-close" class="win-btn close" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <!-- Header: current zone + settings -->
    <header class="top">
      <button id="zone-button" class="zone-button" title="Choose zone">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M12 6h.01"/><circle cx="12" cy="14" r="4"/><path d="M12 14h.01"/></svg>
       <span class="zone-text">
        <span class="zone-label">Zone:</span>
         <span id="zone-name" class="zone-name">No zone</span>
        </span>
      </button>

      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
       <input id="search-input" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
      </div>

      <button id="open-settings" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>

    <!-- Tab bar -->
    <nav class="tabs">
      <button class="tab active" data-tab="playing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        <span>Playing</span>
      </button>
      <button class="tab" data-tab="queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
        <span>Queue</span>
      </button>
      <button class="tab" data-tab="browse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
        <span>Browse</span>
      </button>
      <button class="tab" data-tab="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search</span>
      </button>
    </nav>

    <!-- One page per tab; only the "active" one is shown -->
    <main>
      <section id="tab-playing" class="page active">
        <div id="nothing-playing" class="empty" hidden>Nothing playing in this zone.</div>

        <div id="now-playing">
          <div class="art-wrap">
            <img id="art" class="art" alt="" />
            <!-- Shown instead when the track has no art (or it can't load) -->
            <div id="art-missing" class="art art-placeholder" hidden></div>
          </div>

          <div class="track">
            <div id="title" class="title"></div>
            <div id="artist" class="artist"></div>
            <div id="album" class="album"></div>
          </div>

          <div class="progress">
            <input id="seek" type="range" min="0" max="100" step="1" value="0" />
            <div class="times">
              <span id="elapsed">0:00</span>
              <span id="length">0:00</span>
            </div>
          </div>

          <div class="transport">
            <button id="shuffle" class="icon-btn toggle" title="Shuffle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg>
            </button>
            <button id="previous" class="icon-btn" title="Previous">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
            </button>
            <button id="play-pause" class="play" title="Play / Pause">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
            </button>
            <button id="next" class="icon-btn" title="Next">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
            </button>
            <button id="repeat" class="icon-btn toggle" title="Repeat">
              <svg class="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
              <svg class="icon-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg>
            </button>
          </div>

          <div class="chips">
            <button id="radio" class="chip toggle" title="Roon Radio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
              <span>Roon Radio</span>
            </button>
            <!-- Queue count: click to see the queue -->
            <button id="queue-chip" class="chip link" title="Show the queue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
              <span id="queue-text">0 in queue</span>
            </button>
          </div>
        </div>
      </section>

      <section id="tab-queue" class="page">
        <!-- Top bar: totals, repeat, shuffle (pinned while scrolling) -->
        <div class="queue-top">
          <div class="queue-heading">
            <span class="queue-title">Queue</span>
            <span id="queue-summary" class="queue-summary"></span>
          </div>
          <button id="queue-repeat" class="icon-btn toggle" title="Repeat">
            <svg class="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
            <svg class="icon-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg>
          </button>
          <button id="queue-shuffle" class="icon-btn toggle" title="Shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg>
          </button>
        </div>

        <div id="queue-empty" class="empty" hidden>The queue is empty.</div>

        <!-- Filled by toaster.js: the playing track first, then what's up next -->
        <div id="queue-now-label" class="queue-label">Now playing</div>
        <ol id="queue-list" class="queue-list"></ol>
        <div id="queue-more" class="queue-more" hidden></div>

        <!-- Roon Radio, pinned to the bottom like in Roon -->
        <div class="queue-radio">
          <div class="queue-radio-title">Roon Radio</div>
          <div class="queue-radio-row">
            <span class="queue-radio-desc">Automatically pick music based on your queue</span>
            <label class="switch">
              <input type="checkbox" id="queue-radio" />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>

      <section id="tab-browse" class="page">
        <!-- Back / forward like Roon's (mouse side buttons work too) -->
        <div class="nav-bar">
          <button id="browse-back" class="icon-btn" title="Back" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button id="browse-forward" class="icon-btn" title="Forward" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <span id="browse-nav-title" class="nav-title"></span>
        </div>

        <div id="browse-status" class="empty" hidden></div>

        <!-- Filled by toaster.js: the home list, or a page opened from it -->
        <div id="browse-view"></div>
      </section>

      <section id="tab-search" class="page">
        <!-- Back / forward like Roon's (mouse side buttons work too) -->
        <div class="nav-bar">
          <button id="search-back" class="icon-btn" title="Back" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button id="search-forward" class="icon-btn" title="Forward" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <span id="search-nav-title" class="nav-title"></span>
        </div>

        <div id="search-hint" class="empty">Type in the search bar above and press Enter.</div>
        <div id="search-status" class="empty" hidden></div>

        <!-- Filled by toaster.js: the search results, or a page opened from them -->
        <div id="search-view"></div>
      </section>
    </main>

    <!-- Footer: the zone's output and its volume -->
    <footer id="output-bar" class="output">
      <button id="output-zone" class="output-zone" title="Choose zone">
        <svg class="output-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M12 6h.01"/><circle cx="12" cy="14" r="4"/><path d="M12 14h.01"/></svg>
        <span id="output-name" class="output-name"></span>
      </button>
      <button id="mute" class="icon-btn" title="Mute">
        <svg class="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="100" step="1" value="0" />
      <span id="volume-value" class="volume-value"></span>
    </footer>
        <!-- Zone picker dropdown: filled and positioned by toaster.js -->
      <div id="zone-menu" class="zone-menu" hidden></div>
          <!-- Play Now / Add Next / Queue menu: filled and positioned by toaster.js -->
    <div id="action-menu" class="action-menu" hidden></div>

    <!-- Loading spinner: shown by toaster.js while Roon takes a moment -->
    <div id="loading" class="loading" hidden><div class="spinner"></div></div>

    <!-- Zoom level pill: shown briefly by toaster.js when zooming -->
    <div id="zoom-toast" class="zoom-toast" hidden></div>
  </body>
</html>
