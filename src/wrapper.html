<!doctype html>
<!-- This Source Code Form is subject to the terms of the Mozilla Public
     License, v. 2.0. If a copy of the MPL was not distributed with this
     file, You can obtain one at https://mozilla.org/MPL/2.0/. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roon: Wrapped</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="wrapper.css" />
    <script type="module" src="/wrapper.js" defer></script>
  </head>

  <body>
    <!-- The Wrapper (experimental, see wrapper.rs). The middle of this page
         is a hole cut out of the window; Roon's own window sits behind it.
         The bar at the bottom is Toasted's player for the Toaster's zone.
         Icons: Lucide (lucide.dev, ISC license). -->
    <div class="panel">
      <div class="titlebar" data-tauri-drag-region="deep">
        <span class="titlebar-logo" data-tauri-drag-region="deep"></span>
        <span class="titlebar-title" data-tauri-drag-region="deep">Roon: Wrapped</span>
        <!-- A build number for checking a dev build came through (bumped by hand) -->
        <span id="titlebar-build" class="titlebar-build" data-tauri-drag-region="deep"></span>
        <button id="detach" class="titlebar-action" title="Close the Wrapper and give Roon its own window back">Return Roon</button>
        <span id="status" class="titlebar-status" data-tauri-drag-region="deep" hidden></span>
        <span class="titlebar-spacer" data-tauri-drag-region="deep"></span>
        <!-- While Now Playing is open: back to Roon (same as its X) -->
        <button id="stage-minimize" class="titlebar-minimize" title="Minimize the player and go back to Roon" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          <span>Minimize player</span>
        </button>
        <button id="open-settings" class="titlebar-icon" title="Wrapped Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
        </button>
        <button id="win-min" class="win-btn" title="Minimize">
          <svg viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" /></svg>
        </button>
        <button id="win-max" class="win-btn" title="Maximize">
          <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" /></svg>
        </button>
        <button id="win-close" class="win-btn close" title="Close (Roon keeps running, hidden)">
          <svg viewBox="0 0 10 10"><line x1="1.5" y1="1.5" x2="8.5" y2="8.5" /><line x1="8.5" y1="1.5" x2="1.5" y2="8.5" /></svg>
        </button>
      </div>

      <!-- Shows only until Roon is behind it (the hole is cut once it is) -->
      <div id="hole" class="hole"><span id="hole-note" class="hole-note"></span></div>

      <!-- Player bar: what's playing (left, opens Now Playing), transport
           and progress (middle), zone and volume (right) -->
      <div class="player">
        <div id="info" class="info" title="Now Playing">
          <div class="art-box">
            <img id="art" class="art" alt="" />
            <div id="art-missing" class="art art-placeholder" hidden></div>
          </div>
          <div class="text">
            <!-- Thumbs for a song from the Discover lists (wrapper.js, renderRating) -->
            <div id="rate" class="rate" hidden title="Rate your discovery. A thumbs up says it was a good suggestion: the artists it came from count for more in your next lists, and once you play this artist on your own it becomes a starting point too. A thumbs down keeps them, and bands that sound like them, out. A heart counts like a thumbs up; skipping a list song in its first 30 seconds counts against it.">
              <span class="rate-label">Rate your discovery</span>
              <span class="rate-buttons">
                <button id="rate-down" class="rate-btn down" data-vote="-1" aria-label="Thumbs down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg></button>
                <button id="rate-up" class="rate-btn up" data-vote="1" aria-label="Thumbs up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg></button>
              </span>
            </div>
            <div id="title" class="title">Roon: Toasted</div>
            <div id="album" class="album"></div>
            <div id="artist" class="artist"></div>
          </div>
        </div>
        <!-- Discover: the weekly playlists page (a dot while a new list is unseen) -->
        <button id="discover-btn" class="icon-btn discover-btn" title="Discover: your weekly playlists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg></button>

        <div class="middle">
          <div class="transport">
            <!-- Hearts & Library (experimental, Settings): "+" adds the track to
                 the library, then it's a heart. Hidden unless the feature is on
                 and connected. Without it there are three buttons on each side
                 of play, so they stay centered. -->
            <button id="library-btn" class="icon-btn library spacer" title="Add to library">
              <svg class="icon-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              <svg class="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
            </button>
            <button id="shuffle" class="icon-btn toggle" title="Shuffle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg>
            </button>
            <button id="repeat" class="icon-btn toggle" title="Repeat">
              <svg class="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
              <svg class="icon-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg>
            </button>
            <button id="previous" class="icon-btn" title="Previous">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
            </button>
            <button id="play-pause" class="play" title="Play / Pause">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
            </button>
            <button id="next" class="icon-btn" title="Next">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
            </button>
            <button id="radio" class="icon-btn toggle" title="Roon Radio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
            </button>
            <button id="queue-btn" class="icon-btn" title="Queue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
            </button>
          </div>
          <div class="progress">
            <span id="elapsed" class="time">0:00</span>
            <input id="seek" type="range" min="0" max="100" step="1" value="0" />
            <span id="length" class="time">0:00</span>
          </div>
        </div>

        <div class="right">
          <div id="zone-row" class="zone-row">
          <span id="quality" class="quality" hidden><i class="quality-dot"></i><span id="quality-format" class="quality-format" hidden></span></span>
          <button id="zone-button" class="zone-button" title="Choose zone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M12 6h.01"/><circle cx="12" cy="14" r="4"/><path d="M12 14h.01"/></svg>
            <span id="zone-name">No zone</span>
          </button>
          </div>
          <div class="volume-row">
            <button id="mute" class="icon-btn" title="Mute">
              <svg class="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
            </button>
            <input id="volume" type="range" min="0" max="100" step="1" value="0" />
            <span id="volume-value" class="volume-value"></span>
          </div>
        </div>
      </div>

      <!-- Now Playing: the large player, over Roon and the player bar. Big
           art, an album-art background (optional), and the bar's own
           controls, which move in here while it's open. Each is a "piece"
           the user can move, resize and hide in Edit layout (wrapper.js
           lays them out from the saved layout and adds the resize
           handles). -->
      <section id="stage" class="stage" hidden>
        <div id="stage-bg" class="stage-bg"></div>
        <div id="stage-canvas" class="stage-canvas">
          <div class="piece piece-art" data-piece="art">
            <div class="piece-content">
              <img id="stage-art" alt="" />
              <div id="stage-art-missing" class="art-placeholder" hidden></div>
            </div>
          </div>
          <div class="piece piece-info" data-piece="info"><div class="piece-content"></div></div>
          <div class="piece piece-transport" data-piece="transport"><div class="piece-content"></div></div>
          <div class="piece piece-seek" data-piece="seek"><div class="piece-content"></div></div>
          <div class="piece piece-quality" data-piece="quality"><div class="piece-content"></div></div>
          <div class="piece piece-zone" data-piece="zone"><div class="piece-content"></div></div>
          <div class="piece piece-volume" data-piece="volume"><div class="piece-content"></div></div>
          <!-- Wrapped: a title and icon buttons (each closes Now Playing and
               opens the Wrapped page); its contents are its own control, so
               the layout's font and edges apply like the others' -->
          <div class="piece piece-wrapped" data-piece="wrapped">
            <div class="piece-content">
              <div id="wrapped-piece" class="wrapped-piece">
                <div class="wrapped-piece-title">Wrapped</div>
                <div class="wrapped-piece-buttons">
                  <button class="wrapped-piece-btn" data-action="open" data-tip="Open Wrapped"><svg class="wrapped-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="wrapped-mark-inner"><path d="M1.125 1.125H27.2a3.675 3.675 0 0 1 3.675 3.675v26.075H4.8a3.675 3.675 0 0 1-3.675-3.675z"/></clipPath></defs><path d="M0 0h27.2A4.8 4.8 0 0 1 32 4.8V32H4.8A4.8 4.8 0 0 1 0 27.2z"/><g clip-path="url(#wrapped-mark-inner)"><path d="M0 0h17.75l-11.125 11.125v14.125L0 31.875z" fill="#fff"/><path d="M20.875 0H32v32H8.875V12z" fill="currentColor"/><path d="M32 21.875V32H21.875z" fill="#d29922"/><path d="M14.375 14.375 28.75 0h3.125L14.375 17.5zM14.375 25.375 32 7.75v3.125L17.5 25.375zM18.75 32 32 18.75v3.125L21.875 32z"/></g></svg></button>
                  <button class="wrapped-piece-btn discover" data-action="discover" data-tip="Discover: your weekly playlists"><i class="fresh-dot"></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg></button>
                  <!-- (its icon is Deep Dive's own, put in by wrapper.js) -->
                  <button class="wrapped-piece-btn dive" data-action="dive" data-tip="Deep Dive from this song"></button>
                  <button class="wrapped-piece-btn" data-action="artist" data-tip="Open the artist in Wrapped">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  </button>
                  <button class="wrapped-piece-btn" data-action="album" data-tip="Open the album in Wrapped">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
                <!-- A Discover list's song: why it's there, and its thumbs
                     (wrapper.js, renderRating) -->
                <div id="wrapped-piece-rate" class="wrapped-piece-rate" hidden>
                  <div class="wrapped-piece-why"></div>
                  <div class="wrapped-piece-thumbs">
                    <span class="rate-label" title="A thumbs up makes this artist a starting point for your next Discover lists, so you get more like them. A thumbs down keeps them, and bands that sound like them, out. Without a rating, listening through counts a little in their favor, skipping a little against, and a heart counts as a milder thumbs up.">Rate your discovery</span>
                    <button class="rate-btn down" data-vote="-1" aria-label="Thumbs down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg></button>
                    <button class="rate-btn up" data-vote="1" aria-label="Thumbs up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg></button>
                  </div>
                </div>
                <!-- A Deep Dive's song: the Deep Dive it's from and why it's
                     there, no thumbs (wrapper.js, renderDivePiece) -->
                <div id="wrapped-piece-dive" class="wrapped-piece-rate wrapped-piece-dive" hidden>
                  <div class="wrapped-piece-why"></div>
                </div>
              </div>
            </div>
          </div>
          <div id="guide-v" class="guide guide-v"></div>
          <div id="guide-h" class="guide guide-h"></div>
        </div>

        <div class="stage-tools">
          <!-- Changes kept without saving: shown while not editing; opens
               the editor to save or discard them -->
          <button id="stage-unsaved" class="stage-unsaved" title="Changes not saved to a profile yet. Click to edit, save or discard them." hidden>Unsaved Style</button>
          <button id="stage-edit" class="icon-btn" title="Edit layout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
          </button>
          <button id="stage-close" class="icon-btn" title="Back to Roon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        <!-- Edit layout toolbar: the grip down its left side, then its rows.
             Nothing selected: the profile, what shows and the background.
             A piece selected: that piece's own options. -->
        <div id="stage-editor" class="stage-editor" hidden>
          <span id="editor-grip" class="editor-grip" title="Drag to move this toolbar">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
          </span>
          <div class="editor-rows">
            <!-- The profile: its own line at the top, whatever is selected -->
            <div class="editor-row editor-profile-row">
              <div id="editor-profile" class="editor-group">
                <label class="editor-label" for="editor-profile-select">Profile</label>
                <select id="editor-profile-select" class="editor-select"></select>
                <span id="editor-unsaved" class="editor-unsaved" hidden>Unsaved</span>
                <button id="profile-save" class="editor-btn" title="Save your changes to this profile">Save</button>
                <button id="profile-save-as" class="editor-btn" title="Save this layout as a new profile">Save as new</button>
                <button id="profile-rename" class="editor-btn">Rename</button>
                <button id="profile-delete" class="editor-btn">Delete</button>
              </div>
            </div>
            <div class="editor-row editor-global">
              <div class="editor-group">
                <span class="editor-label">Show</span>
                <button class="chip" data-show="art">Art</button>
                <button class="chip" data-show="info">Track</button>
                <button class="chip" data-show="transport">Controls</button>
                <button class="chip" data-show="seek">Seek</button>
                <button class="chip" data-show="zone">Zone</button>
                <button class="chip" data-show="quality">Quality</button>
                <button class="chip" data-show="volume">Volume</button>
                <button class="chip" data-show="wrapped">Wrapped</button>
              </div>
            </div>
            <div class="editor-row editor-global">
              <div class="editor-group">
                <span class="editor-label">Background</span>
                <button class="chip" data-bg="plain">Plain</button>
                <button class="chip" data-bg="art">Album art</button>
                <label class="editor-check" title="Use these fonts, icons and bar styles in the player bar too, when Now Playing is closed"><input id="editor-barstyle" type="checkbox" /> Style player bar</label>
                <label class="editor-check" title="What's white takes the app's or album's color, and what has that color turns white (the title, the play button, buttons that are on)"><input id="editor-invert" type="checkbox" /> Invert colors</label>
                <!-- shown when the layout's shape isn't the window's (the
                     dashed frame): makes it the window's shape -->
                <label class="editor-check" title="On: the layout keeps the shape it was made in, as big as fits, with space added at the sides (or top and bottom) when the window is another shape. Off: the pieces spread over the whole window, whatever its shape."><input id="editor-keepshape" type="checkbox" checked /> Keep shape</label>
                <button id="editor-shape-fit" class="editor-btn" title="The layout keeps the shape it was made in, with space added at the sides (or top and bottom) when the window is another shape. This gives it this window's shape instead; the pieces stretch to fill it." hidden>Fit to this window</button>
              </div>
            </div>
            <div class="editor-row editor-piece">
              <div id="editor-text" class="editor-group" hidden>
                <button class="align-btn" data-align="left" title="Align left">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H3"/><path d="M17 18H3"/><path d="M21 6H3"/></svg>
                </button>
                <button class="align-btn" data-align="center" title="Align center">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 12H7"/><path d="M19 18H5"/><path d="M21 6H3"/></svg>
                </button>
                <button class="align-btn" data-align="right" title="Align right">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H9"/><path d="M21 18H7"/><path d="M21 6H3"/></svg>
                </button>
                <label class="editor-label" for="editor-lines">Title lines</label>
                <select id="editor-lines" class="editor-select">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
              </div>
              <div id="editor-font" class="editor-group" hidden>
                <label class="editor-label" for="editor-font-select">Font</label>
                <select id="editor-font-select" class="editor-select"></select>
                <label class="editor-check" title="Use this font for every piece with text"><input id="editor-font-all" type="checkbox" checked /> All</label>
              </div>
              <div id="editor-icons" class="editor-group" hidden>
                <label class="editor-label" for="editor-icons-select">Icons</label>
                <select id="editor-icons-select" class="editor-select"></select>
                <label class="editor-check" title="Use this pack for every piece with icons"><input id="editor-icons-all" type="checkbox" checked /> All</label>
              </div>
              <div id="editor-quality" class="editor-group" hidden>
                <label class="editor-check" title="Show what the playing file is next to the light: format, sample rate, bit depth, channels (needs Hearts &amp; Library)"><input id="editor-quality-format" type="checkbox" /> File format</label>
                <span id="editor-format-side" class="editor-group" title="Which side of the light the format goes">
                  <button class="chip" data-format-side="left">Left</button>
                  <button class="chip" data-format-side="right">Right</button>
                  <button class="chip" data-format-side="above">Above</button>
                  <button class="chip" data-format-side="below">Below</button>
                </span>
              </div>
              <div id="editor-play" class="editor-group" hidden>
                <span class="editor-label">Play button</span>
                <button class="chip" data-play="circle">Circle</button>
                <button class="chip" data-play="plain">Plain</button>
              </div>
              <div id="editor-volume" class="editor-group" hidden>
                <button class="chip" data-vertical="true">Vertical</button>
                <button class="chip" data-vertical="false">Horizontal</button>
              </div>
              <!-- Seek only, next to Font: Roon's real waveform of the track
                   (local files), with the Bar as its fallback -->
              <div id="editor-waveform" class="editor-group" hidden>
                <label class="editor-check" title="Roon's own waveform of the playing track (local files, needs Hearts &amp; Library). When there isn't one, the Bar below is used."><input id="editor-waveform-check" type="checkbox" /> Waveform</label>
                <select id="editor-waveform-look" class="editor-select off" title="The waveform's look">
                  <option value="roon">Roon</option>
                  <option value="pills">Pills</option>
                  <option value="shape">Solid shape</option>
                  <option value="neon">Neon outline</option>
                  <option value="led">LED</option>
                  <option value="art">Album art</option>
                </select>
                <label id="editor-waveform-loud-label" class="editor-check off" title="Color each part by how loud it is: quiet in the deep shade, loud in the hot one (not for Album art)"><input id="editor-waveform-loud" type="checkbox" /> Loudness</label>
                <label id="editor-waveform-alive-label" class="editor-check off" title="Near the playhead the waveform bounces gently around its real height; the rest stays still"><input id="editor-waveform-alive" type="checkbox" /> Alive</label>
              </div>
              <!-- Always a line of its own, so the options that come and go
                   (custom color, Mirrored's Top / Bottom) never reflow it -->
              <div id="editor-bar" class="editor-group" hidden>
                <label class="editor-label" for="editor-bar-select">Bar</label>
                <select id="editor-bar-select" class="editor-select" title="The bar's look (with Waveform on: when there's no waveform)">
                  <option value="line">Line</option>
                  <option value="thick">Thick</option>
                  <option value="hairline">Hairline</option>
                  <option value="segments">Segments</option>
                  <option value="wave">Wave</option>
                  <option value="spectrum">Spectrum</option>
                  <option value="beam">Beam</option>
                  <option value="glow">Glow line</option>
                  <option value="dots">LED meter</option>
                  <option value="ribbon">Ribbon</option>
                  <option value="neon">Neon tube</option>
                  <option value="mountain">Mountains</option>
                  <option value="particles">Particles</option>
                  <option value="plasma">Plasma</option>
                  <option value="art">Album art</option>
                </select>
                <span class="editor-label">Color</span>
                <button class="chip" data-color="app" title="The app's colors (Wave: the rainbow; the other drawn bars: blue-purple)">App</button>
                <button class="chip" data-color="album" title="The playing album's color">Album</button>
                <button class="chip" data-color="custom">Custom</button>
                <input id="editor-color" class="editor-color" type="color" value="#7b5fc7" title="Custom color" />
                <span id="editor-wave" class="editor-group" hidden>
                  <label class="editor-check"><input id="editor-mirror" type="checkbox" /> Mirrored</label>
                  <span id="editor-side" class="editor-group">
                    <button class="chip" data-side="top">Top</button>
                    <button class="chip" data-side="bottom">Bottom</button>
                  </span>
                </span>
              </div>
            </div>
            <div class="editor-row editor-piece">
              <div id="editor-labels" class="editor-group" hidden title="The size of this bar's times or level and its icons, apart from the bar itself (double-click for 100%)">
                <label class="editor-label" for="editor-label-scale">Text &amp; icons</label>
                <input id="editor-label-scale" class="editor-range" type="range" min="50" max="200" step="5" />
                <span id="editor-label-scale-value" class="editor-value"></span>
              </div>
              <div id="editor-text-edge" class="editor-group" hidden>
                <label class="editor-label" for="editor-text-edge-select">Text edge</label>
                <select id="editor-text-edge-select" class="editor-select">
                  <option value="none">None</option>
                  <option value="stroke">Black outline</option>
                  <option value="glow">Black glow</option>
                </select>
                <input id="editor-text-edge-size" class="editor-range" type="range" min="1" max="6" step="1" title="Thickness" />
                <span id="editor-text-edge-value" class="editor-value"></span>
                <label class="editor-check" title="Use this edge for every piece with text"><input id="editor-text-edge-all" type="checkbox" checked /> All</label>
              </div>
              <div id="editor-icon-edge" class="editor-group" hidden>
                <label class="editor-label" for="editor-icon-edge-select">Icon edge</label>
                <select id="editor-icon-edge-select" class="editor-select">
                  <option value="none">None</option>
                  <option value="stroke">Black outline</option>
                  <option value="glow">Black glow</option>
                </select>
                <input id="editor-icon-edge-size" class="editor-range" type="range" min="1" max="6" step="1" title="Thickness" />
                <span id="editor-icon-edge-value" class="editor-value"></span>
                <label class="editor-check" title="Use this edge for every piece with icons"><input id="editor-icon-edge-all" type="checkbox" checked /> All</label>
              </div>
            </div>
            <div class="editor-row editor-actions">
              <button id="editor-reset" class="editor-btn" title="Undo your changes since the profile was last saved">Reset</button>
              <button id="editor-done" class="editor-btn primary">Done</button>
            </div>
          </div>
        </div>

        <!-- Questions while editing (save changes, profile names) -->
        <div id="stage-dialog" class="stage-dialog" hidden>
          <div class="dialog-box" role="dialog" aria-modal="true">
            <p id="dialog-text" class="dialog-text"></p>
            <input id="dialog-input" class="dialog-input" type="text" maxlength="40" autocomplete="off" spellcheck="false" hidden />
            <div id="dialog-buttons" class="dialog-buttons"></div>
          </div>
        </div>
      </section>

      <!-- Queue panel: slides over the right side of Roon (wrapper.js tells
           wrapper.rs to keep this part of the window) -->
      <aside id="queue-panel" class="queue-panel" hidden>
        <div class="queue-head">
          <div class="queue-heading">
            <div class="queue-title">Queue</div>
            <div id="queue-summary" class="queue-summary"></div>
          </div>
          <div class="queue-actions">
            <button id="queue-save" class="queue-roon" title="Save the whole queue, played songs too, as a Roon playlist">Save as playlist</button>
            <button id="queue-roon" class="queue-roon" title="Show Roon's own queue (Ctrl+E in Roon)">Open Roon's queue</button>
          </div>
          <button id="queue-close" class="icon-btn" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <!-- "Save as playlist" asks for a name here (empty: the default) -->
        <form id="queue-save-form" class="queue-save-form" hidden>
          <input id="queue-save-name" type="text" spellcheck="false" autocomplete="off" />
          <button type="submit" class="queue-roon">Save</button>
          <button type="button" id="queue-save-cancel" class="queue-roon">Cancel</button>
        </form>
        <div class="queue-scroll">
          <p id="queue-empty" class="queue-empty" hidden>The queue is empty.</p>
          <ol id="queue-list" class="queue-list"></ol>
          <p id="queue-more" class="queue-more" hidden></p>
        </div>
      </aside>

      <!-- Zone picker dropdown: filled and positioned by wrapper.js -->
      <div id="zone-menu" class="zone-menu" hidden></div>

      <!-- Wrapped: the button over Roon's logo (top-left of its sidebar),
           its menu, and the page over Roon's content area. All three are
           covers (wrapper.js tells wrapper.rs to keep them part of the
           window); wrapper.js places them by Roon's sidebar. -->
      <div id="wrapped-btn" class="wrapped-btn" hidden>
        <div class="wrapped-face">
          <button id="wrapped-open" class="wrapped-open" title="Open Wrapped">Wrapped</button>
          <button id="wrapped-arrow" class="wrapped-arrow" title="Wrapped side menu">
            <svg class="wrapped-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <!-- The same, in Roon's content header: opens Roon's current album or
           artist in Wrapped, and stands in for the sidebar button while the
           sidebar is collapsed -->
      <div id="wrapped-page-btn" class="wrapped-page-btn" hidden>
        <div class="wrapped-face">
          <button id="wrapped-page-open" class="wrapped-page-open">Wrapped</button>
          <button id="wrapped-page-arrow" class="wrapped-page-arrow" title="Wrapped side menu">
            <svg class="wrapped-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <!-- Wrapped's side menu: its pages as buttons, over Roon's sidebar
           (the arrow on either Wrapped button drops it down and hides it) -->
      <aside id="wrapped-side" class="wrapped-side" hidden></aside>
      <section id="wrapped" class="wrapped" hidden>
        <div class="wrapped-head">
          <button id="wrapped-side-btn" class="icon-btn" title="Wrapped menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
          </button>
          <button id="wrapped-back" class="icon-btn" title="Back" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="wrapped-heading">
            <div id="wrapped-title" class="wrapped-title">Wrapped</div>
            <div id="wrapped-sub" class="wrapped-sub" hidden></div>
          </div>
          <nav id="wrapped-nav" class="wrapped-nav"></nav>
          <div class="wrapped-bar-search">
            <input id="wrapped-bar-input" class="wrapped-search wrapped-bar-input" type="search" placeholder="Search your library, Qobuz and TIDAL" autocomplete="off" spellcheck="false" />
            <div id="wrapped-recent" class="wrapped-recent" hidden></div>
          </div>
          <button id="wrapped-close" class="icon-btn" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div id="wrapped-body" class="wrapped-body"></div>
      </section>
    </div>
  </body>
</html>
