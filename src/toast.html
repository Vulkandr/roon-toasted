<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roon: Toasted</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="toast.css" />
    <script type="module" src="/toast.js" defer></script>
  </head>

  <body>
    <!-- The now-playing toast (see toast.rs for when it shows). Clicking it
         opens the Toaster; x or a right-click just closes it. -->
    <div id="toast" class="toast">
      <div class="art-box">
        <img id="art" class="art" alt="" />
        <div id="art-missing" class="art art-placeholder" hidden></div>
      </div>

      <div class="text">
        <div id="label" class="label">Now Playing</div>
        <div id="title" class="title"></div>
        <div id="artist" class="artist"></div>
        <div id="album" class="album"></div>
      </div>

      <button id="dismiss" class="dismiss" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>

      <!-- Time left before it goes away (stops while the mouse is on it) -->
      <div class="countdown"><div id="bar" class="bar"></div></div>
    </div>
  </body>
</html>
