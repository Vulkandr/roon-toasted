[package]
name = "roon-library"
version = "0.1.0"
edition = "2021"
description = "Heart tracks and add them to the library over Roon's internal client protocol (unofficial, experimental)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
