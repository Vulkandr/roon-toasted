[package]
name = "roon-toasted"
version = "1.3.1"
description = "Roon: Toasted, a Roon companion for Windows"
authors = ["Vulkandr"]
license = "MPL-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roon_toasted_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Roon connection: discovery, pairing, transport, browse (MIT/Apache-2.0, github.com/shin1ohno/roon-rs)
roon-api = "0.5.3"
roon-sood = "0.5.3"
# Hearts and add-to-library over Roon's internal client protocol (experimental,
# see library.rs); our own crate in roon-library/
roon-library = { path = "roon-library" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net", "io-util"] }
# Reads the tray icon file, to pick the right size for the screen (see icon.rs)
ico = "0.5"
# Prints library warnings to the terminal in dev builds
tracing-subscriber = "0.3"
tauri-plugin-updater = "2"
# Artist tags from Last.fm and MusicBrainz for Wrapped (see wrapped.rs); the
# same client roon-api already builds
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Tier 3 (sound.rs, audio.rs): the Discogs-EffNet models run with tract (pure
# Rust, nothing extra to install), the songs decoded with Symphonia (the
# previews: MP3 from Deezer, AAC from Apple; your own files through Roon:
# FLAC, ALAC, MP3, AAC, WAV, AIFF, Ogg Vorbis), the FFT for the mel bands,
# and the models' SHA-256 check and the songs' prints in base64
tract-onnx = { version = "0.23", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "pcm", "wav", "aiff", "ogg", "vorbis"] }
rustfft = "6"
sha2 = "0.10"
base64 = "0.22"

# Desktop-only plugins
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "~2.3"

# Windows only: rounded corners for the frameless windows, showing the toast
# without taking focus, screen names for the toast's Monitor setting, and
# registering roon-toasted:// links, keeping the taskbar widget in place, and
# the Wrapper (wrapper.rs: window regions, finding Roon's window; skin.rs:
# the color filter over Roon's sidebar, via the Magnification API; pictures
# of Roon's window, to see whether its player screen is open: Storage_Xps;
# ocr.rs: reading a page's title off the screen with Windows' OCR engine;
# sound.rs: Windows' folder picker for "Manually choose music folder")
# (same version Tauri uses)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Devices_Display", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Magnification", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_Storage_Xps", "Win32_UI_Input_KeyboardAndMouse", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Security_Cryptography", "Foundation_Collections"] }


# Local copies of two Roon libraries with fixes: roon-api in vendor/roon-api
# (shuffle/repeat/Roon Radio changes, queue, Core address changes) and
# roon-sood in vendor/roon-sood (no flashing console window on Windows).
# See VENDORED.md in each folder.
[patch.crates-io]
roon-api = { path = "vendor/roon-api" }
roon-sood = { path = "vendor/roon-sood" }

# The dependencies built optimized in dev builds too: tier 3's models (tract)
# run far too slowly unoptimized. The app's own code still builds quickly.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
