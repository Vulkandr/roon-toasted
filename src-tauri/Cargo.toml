[package]
name = "roon-toasted"
version = "0.9.0"
description = "Roon: Toasted, a Roon companion for Windows"
authors = ["Vulkandr"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roon_toasted_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Roon connection: discovery, pairing, transport, browse (MIT/Apache-2.0, github.com/shin1ohno/roon-rs)
roon-api = "0.5.3"
roon-sood = "0.5.3"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net", "io-util"] }
# Reads the tray icon file, to pick the right size for the screen (see icon.rs)
ico = "0.5"
# Prints library warnings to the terminal in dev builds
tracing-subscriber = "0.3"

# Desktop-only plugins
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "~2.3"

# Windows only: rounded corners for the frameless windows, showing the toast
# without taking focus, screen names for the toast's Monitor setting, and
# registering roon-toasted:// links, and keeping the taskbar widget in place
# (same version Tauri uses)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_Devices_Display", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Accessibility"] }


# Local copies of two Roon libraries with fixes: roon-api in vendor/roon-api
# (shuffle/repeat/Roon Radio changes, queue, Core address changes) and
# roon-sood in vendor/roon-sood (no flashing console window on Windows).
# See VENDORED.md in each folder.
[patch.crates-io]
roon-api = { path = "vendor/roon-api" }
roon-sood = { path = "vendor/roon-sood" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
